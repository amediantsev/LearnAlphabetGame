# Builds the APK on every PR and on main, and publishes it as a GitHub release
# so it can be downloaded straight to a phone:
#   - PR #N    -> pre-release "pr-N" (deleted when the PR closes) + a PR comment with the link
#   - main     -> release "build-latest", always at
#                 https://github.com/<owner>/<repo>/releases/latest/download/abetka-debug.apk
name: APK

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: apk-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  GH_TOKEN: ${{ github.token }}
  GH_REPO: ${{ github.repository }}

jobs:
  build:
    if: github.event.action != 'closed'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Test and build
        run: ./gradlew testDebugUnitTest assembleDebug

      - name: Rename APK
        run: cp app/build/outputs/apk/debug/app-debug.apk abetka-debug.apk

      - uses: actions/upload-artifact@v4
        with:
          name: abetka-debug-apk
          path: abetka-debug.apk
          retention-days: 30

      - name: Publish PR pre-release
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          tag="pr-$PR"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" abetka-debug.apk \
            --prerelease --target "$SHA" \
            --title "Абетка: збірка PR #$PR" \
            --notes "Тестова збірка з PR #$PR (коміт ${SHA:0:7}). Видаляється, коли PR закривають."

          url="https://github.com/$GH_REPO/releases/download/$tag/abetka-debug.apk"
          marker="<!-- apk-build -->"
          body="$marker
          📱 **APK для цього PR:** [abetka-debug.apk]($url)

          Зібрано з коміту \`${SHA:0:7}\`. Відкрийте посилання на телефоні, щоб завантажити й встановити."
          id="$(gh api "repos/$GH_REPO/issues/$PR/comments" --paginate \
            --jq ".[] | select(.body | startswith(\"$marker\")) | .id" | head -1)"
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GH_REPO/issues/comments/$id" -f body="$body" >/dev/null
          else
            gh pr comment "$PR" --body "$body"
          fi

      - name: Publish latest release
        if: github.event_name == 'push'
        run: |
          tag="build-latest"
          gh release delete "$tag" --cleanup-tag --yes 2>/dev/null || true
          gh release create "$tag" abetka-debug.apk \
            --latest --target "$GITHUB_SHA" \
            --title "Абетка: остання збірка" \
            --notes "Збірка з гілки main (коміт ${GITHUB_SHA:0:7})."

  cleanup:
    if: github.event_name == 'pull_request' && github.event.action == 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Delete PR pre-release
        run: gh release delete "pr-${{ github.event.pull_request.number }}" --cleanup-tag --yes || true
